<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoYoLAB Toolkit - Multi Account Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/60 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-fuchsia-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-gamepad text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">HoYoLAB Multi-Tool</h1>
          <p class="text-xs text-zinc-400">Quản lý Đa Tài Khoản • Đổi Giftcode • Săn Quà In-Game & Restock</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium flex items-center gap-2 transition shadow shadow-indigo-600/30">
          <i class="fa-solid fa-plus text-xs"></i> Thêm Tài Khoản
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left Column: Accounts List & Controls -->
    <div class="lg:col-span-2 space-y-4">
      
      <!-- Batch Actions Card -->
      <div class="bg-zinc-900/70 border border-zinc-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-zinc-300 flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-400"></i> Thao tác hàng loạt (Tất cả tài khoản)
          </h2>
          <span id="accCountBadge" class="text-xs bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full">0 tài khoản</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
          <button onclick="runBatchRedeem()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700/80 border border-zinc-700/60 rounded-xl text-xs font-medium text-emerald-400 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-gift"></i> Nạp Giftcode Tất Cả
          </button>
          <button onclick="runBatchMimo()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700/80 border border-zinc-700/60 rounded-xl text-xs font-medium text-indigo-400 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-cart-shopping"></i> Đổi Quà Tất Cả
          </button>
          <button onclick="runBatchSniper()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700/80 border border-zinc-700/60 rounded-xl text-xs font-medium text-amber-400 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-crosshairs"></i> Canh Restock Tất Cả
          </button>
          <button onclick="refreshAllAccounts()" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700/80 border border-zinc-700/60 rounded-xl text-xs font-medium text-zinc-300 flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-arrows-rotate"></i> Làm Mới
          </button>
        </div>
      </div>

      <!-- Accounts Grid -->
      <div id="accountsContainer" class="space-y-3">
        <!-- Rendered by JS -->
      </div>

    </div>

    <!-- Right Column: Realtime Console Log -->
    <div class="space-y-4">
      <div class="bg-zinc-900/70 border border-zinc-800 rounded-2xl p-4 shadow-sm flex flex-col h-[650px] sticky top-20">
        <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <h2 class="text-sm font-semibold text-zinc-200">Nhật Ký Hoạt Động (Live Log)</h2>
          </div>
          <button onclick="clearLogs()" class="text-xs text-zinc-500 hover:text-zinc-300 transition">
            <i class="fa-solid fa-trash-can"></i> Xóa log
          </button>
        </div>

        <!-- Log Terminal Output -->
        <div id="logOutput" class="flex-1 overflow-y-auto mt-3 font-mono text-xs text-zinc-300 space-y-1 p-2 bg-zinc-950/80 rounded-xl border border-zinc-900">
          <div class="text-zinc-500">[System] Sẵn sàng nhận lệnh...</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Account Modal (Add / Edit) -->
  <div id="accountModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-zinc-300 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <h3 id="modalTitle" class="text-base font-bold text-zinc-100 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-400"></i> Thêm Tài Khoản Mới
      </h3>

      <form id="accountForm" onsubmit="handleSaveAccount(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="accId">

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">Tên Gợi Nhớ (Ví dụ: Acc Chính, Acc Clone 1)</label>
          <input type="text" id="accName" required placeholder="Acc của tôi..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">Game Mục Tiêu</label>
          <select id="accGame" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
            <option value="GENSHIN">Genshin Impact</option>
            <option value="STARRAIL">Honkai: Star Rail</option>
            <option value="ZZZ">Zenless Zone Zero</option>
          </select>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">ltuid_v2 (hoặc ltuid)</label>
          <input type="text" id="accLtuid" required placeholder="12345678" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 font-mono">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">ltoken_v2 (hoặc ltoken)</label>
          <input type="text" id="accLtoken" required placeholder="v2_CAIS..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 font-mono">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-medium">cookie_token_v2 (Bắt buộc nếu muốn tự nạp mã vào game)</label>
          <input type="text" id="accCookieToken" placeholder="v2_CAQS..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 font-mono">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-zinc-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg font-medium transition">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition shadow shadow-indigo-600/30">Lưu Tài Khoản</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let accounts = [];

    async function fetchAccounts() {
      try {
        const res = await fetch('/api/accounts');
        accounts = await res.json();
        renderAccounts();
        document.getElementById('accCountBadge').innerText = `${accounts.length} tài khoản`;
      } catch (err) {
        log(`[Lỗi] Không thể tải danh sách tài khoản: ${err.message}`, 'error');
      }
    }

    function renderAccounts() {
      const container = document.getElementById('accountsContainer');
      if (accounts.length === 0) {
        container.innerHTML = `
          <div class="bg-zinc-900/40 border border-dashed border-zinc-800 rounded-2xl p-8 text-center text-zinc-500 text-xs">
            Chưa có tài khoản nào. Nhấn <b>"Thêm Tài Khoản"</b> để bắt đầu.
          </div>
        `;
        return;
      }

      container.innerHTML = accounts.map(acc => `
        <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 hover:border-zinc-700/80 transition shadow-sm space-y-3">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-zinc-800 flex items-center justify-center text-zinc-300 text-sm border border-zinc-700/50">
                ${acc.game === 'GENSHIN' ? '✨' : (acc.game === 'STARRAIL' ? '🚂' : '⚡')}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-sm text-zinc-200">${acc.name}</h3>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${
                    acc.game === 'GENSHIN' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 
                    (acc.game === 'STARRAIL' ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20')
                  }">${acc.game}</span>
                </div>
                <div class="text-xs text-zinc-400 flex items-center gap-3 mt-0.5">
                  <span>UID: <b class="text-zinc-200 font-mono">${acc.uid || 'Chưa kiểm tra'}</b></span>
                  <span>Level: <b class="text-zinc-200">${acc.level || '-'}</b></span>
                  <span>Mimo: <b class="text-amber-400">${acc.mimo_points !== undefined ? acc.mimo_points + ' pts' : '-'}</b></span>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-1.5">
              <button onclick="checkAccount('${acc.id}')" title="Kiểm tra thông tin" class="p-2 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 rounded-lg transition text-xs">
                <i class="fa-solid fa-rotate"></i>
              </button>
              <button onclick="openModal('${acc.id}')" title="Chỉnh sửa" class="p-2 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 rounded-lg transition text-xs">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteAccount('${acc.id}')" title="Xóa" class="p-2 hover:bg-red-500/10 text-zinc-400 hover:text-red-400 rounded-lg transition text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>

          <!-- Quick Action Buttons for single account -->
          <div class="flex items-center gap-2 pt-2 border-t border-zinc-800/60">
            <button onclick="runRedeemSingle('${acc.id}')" class="px-3 py-1.5 bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-400 border border-emerald-600/20 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
              <i class="fa-solid fa-gift"></i> Nạp Giftcode
            </button>
            <button onclick="runMimoSingle('${acc.id}')" class="px-3 py-1.5 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-600/20 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
              <i class="fa-solid fa-cart-shopping"></i> Đổi Quà Mimo
            </button>
            <button onclick="runSniperSingle('${acc.id}')" class="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
              <i class="fa-solid fa-crosshairs"></i> Canh Restock Tài Nguyên
            </button>
          </div>
        </div>
      `).join('');
    }

    function openModal(id = null) {
      document.getElementById('accountModal').classList.remove('hidden');
      if (id) {
        const acc = accounts.find(a => a.id === id);
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen text-indigo-400"></i> Chỉnh Sửa Tài Khoản';
        document.getElementById('accId').value = acc.id;
        document.getElementById('accName').value = acc.name;
        document.getElementById('accGame').value = acc.game;
        document.getElementById('accLtuid').value = acc.ltuid_v2;
        document.getElementById('accLtoken').value = acc.ltoken_v2;
        document.getElementById('accCookieToken').value = acc.cookie_token_v2 || '';
      } else {
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-plus text-indigo-400"></i> Thêm Tài Khoản Mới';
        document.getElementById('accId').value = '';
        document.getElementById('accountForm').reset();
      }
    }

    function closeModal() {
      document.getElementById('accountModal').classList.add('hidden');
    }

    async function handleSaveAccount(e) {
      e.preventDefault();
      const id = document.getElementById('accId').value;
      const data = {
        id: id || 'acc_' + Date.now(),
        name: document.getElementById('accName').value,
        game: document.getElementById('accGame').value,
        ltuid_v2: document.getElementById('accLtuid').value.trim(),
        ltoken_v2: document.getElementById('accLtoken').value.trim(),
        cookie_token_v2: document.getElementById('accCookieToken').value.trim()
      };

      try {
        await fetch('/api/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        closeModal();
        await fetchAccounts();
        log(`[Tài khoản] Đã lưu thông tin cho '${data.name}'!`, 'success');
      } catch (err) {
        log(`[Lỗi] Không thể lưu tài khoản: ${err.message}`, 'error');
      }
    }

    async function deleteAccount(id) {
      const acc = accounts.find(a => a.id === id);
      if (!confirm(`Bạn có chắc muốn xóa tài khoản "${acc ? acc.name : id}" không?`)) return;
      try {
        await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
        await fetchAccounts();
        log(`[Tài khoản] Đã xóa tài khoản.`, 'info');
      } catch (err) {
        log(`[Lỗi] Xóa tài khoản thất bại: ${err.message}`, 'error');
      }
    }

    async function checkAccount(id) {
      const acc = accounts.find(a => a.id === id);
      log(`[*] Đang kiểm tra thông tin cho: ${acc.name}...`);
      try {
        const res = await fetch(`/api/accounts/${id}/check`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          log(`[✔] ${acc.name}: UID ${data.uid} (Lv ${data.level}) - Mimo: ${data.mimo_points} pts`, 'success');
          await fetchAccounts();
        } else {
          log(`[x] ${acc.name} thất bại: ${data.error}`, 'error');
        }
      } catch (err) {
        log(`[x] Lỗi kết nối khi kiểm tra ${acc.name}: ${err.message}`, 'error');
      }
    }

    async function refreshAllAccounts() {
      for (const acc of accounts) {
        await checkAccount(acc.id);
      }
    }

    // Single Actions
    async function runRedeemSingle(id) {
      const acc = accounts.find(a => a.id === id);
      log(`[🚀] Bắt đầu nạp giftcode cho: ${acc.name}...`);
      listenSSE(`/api/redeem/${id}`);
    }

    async function runMimoSingle(id) {
      const acc = accounts.find(a => a.id === id);
      log(`[🚀] Bắt đầu quét shop Mimo cho: ${acc.name}...`);
      listenSSE(`/api/mimo/${id}`);
    }

    async function runSniperSingle(id) {
      const acc = accounts.find(a => a.id === id);
      log(`[🎯] Kích hoạt Canh Restock Tài Nguyên cho: ${acc.name}...`);
      listenSSE(`/api/sniper/${id}`);
    }

    // Batch Actions
    async function runBatchRedeem() {
      if (accounts.length === 0) return alert('Chưa có tài khoản nào!');
      log(`[🚀 BATCH] Bắt đầu nạp giftcode cho TẤT CẢ ${accounts.length} tài khoản...`);
      listenSSE(`/api/batch/redeem`);
    }

    async function runBatchMimo() {
      if (accounts.length === 0) return alert('Chưa có tài khoản nào!');
      log(`[🚀 BATCH] Bắt đầu đổi quà Mimo cho TẤT CẢ ${accounts.length} tài khoản...`);
      listenSSE(`/api/batch/mimo`);
    }

    async function runBatchSniper() {
      if (accounts.length === 0) return alert('Chưa có tài khoản nào!');
      log(`[🎯 BATCH] Bắt đầu canh Restock tài nguyên cho TẤT CẢ ${accounts.length} tài khoản...`);
      listenSSE(`/api/batch/sniper`);
    }

    // Server-Sent Events (SSE) for Realtime Log Streaming
    function listenSSE(url) {
      const eventSource = new EventSource(url);
      eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.done) {
          eventSource.close();
          log(`[Hoàn Tất] Tác vụ đã kết thúc.`, 'success');
          fetchAccounts();
        } else {
          log(data.message, data.type || 'info');
        }
      };
      eventSource.onerror = function() {
        eventSource.close();
      };
    }

    function log(message, type = 'info') {
      const container = document.getElementById('logOutput');
      const time = new Date().toLocaleTimeString();
      let colorClass = 'text-zinc-300';
      if (type === 'success' || message.includes('✔') || message.includes('ĐÃ MUA') || message.includes('GIẬT ĐƯỢC')) colorClass = 'text-emerald-400 font-bold';
      else if (type === 'error' || message.includes('✖') || message.includes('Lỗi')) colorClass = 'text-rose-400';
      else if (type === 'warn' || message.includes('⏳') || message.includes('Đếm ngược') || message.includes('Bắt đầu')) colorClass = 'text-amber-400 font-semibold';

      const div = document.createElement('div');
      div.className = `leading-relaxed ${colorClass}`;
      div.innerText = `[${time}] ${message}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logOutput').innerHTML = '<div class="text-zinc-500">[System] Log đã được làm sạch.</div>';
    }

    window.onload = fetchAccounts;
  </script>
</body>
</html>
